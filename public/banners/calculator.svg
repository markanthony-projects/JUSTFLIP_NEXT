<svg
  width="700"
  height="500"
  viewBox="0 0 600 600"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    :root {
      --color-primary: #002B5B;
    }
  </style>

  <!-- background buildings -->
  <g opacity="0.1">
    <rect opacity="0.5" x="80" y="170" width="65" height="150" rx="4" fill="#074a96"/>
    <rect opacity="0.8" x="150" y="120" width="90" height="200" rx="4" fill="#074a96"/>
    <rect x="245" y="160" width="75" height="170" rx="4" fill="#074a96"/>
    <rect x="340" y="100" width="105" height="220" rx="4" fill="#074a96"/>
    <rect opacity="0.8" x="450" y="140" width="80" height="180" rx="4" fill="#074a96"/>
    <rect opacity="0.5" x="525" y="180" width="60" height="140" rx="4" fill="#03244a"/>
  </g>

  <!-- windows -->
  <g fill="var(--color-primary, #002B5B)">
    <rect x="95" y="195" width="12" height="15"/>
    <rect x="115" y="195" width="12" height="15"/>
    <rect x="95" y="220" width="12" height="15"/>
    <rect x="115" y="220" width="12" height="15"/>

    <rect x="170" y="150" width="14" height="16"/>
    <rect x="205" y="150" width="14" height="16"/>
    <rect x="170" y="185" width="14" height="16"/>
    <rect x="205" y="185" width="14" height="16"/>

    <rect x="370" y="130" width="14" height="16"/>
    <rect x="405" y="130" width="14" height="16"/>
    <rect x="370" y="165" width="14" height="16"/>
    <rect x="405" y="165" width="14" height="16"/>
  </g>

  <!-- ground -->
  <rect opacity="0.6" x="40" y="330" width="550" height="10" rx="6" fill="#073871"/>

  <path 
    d="M220 260L310 175L400 260V360H220V260Z" 
    fill="#e3edf4" 
  /> 

  <path 
    d="M210 260L310 165L410 260" 
    stroke="var(--color-primary, #002B5B)" 
    stroke-width="8" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  /> 

  <path 
    d="M310 175L410 260V360H310V175Z" 
    fill="var(--color-primary, #002B5B)" 
  />

  <!-- door -->
  <rect
    x="285"
    y="288"
    width="40"
    height="70"
    rx="5"
    fill="#195faf"
  />

  <circle
    cx="317"
    cy="328"
    r="3"
    fill="var(--color-primary, #002B5B)"
  />

  <!-- window -->
  <rect
    x="265"
    y="270"
    width="30"
    height="30"
    rx="4"
    fill="#C9E5F7"
    stroke="var(--color-primary, #002B5B)"
    stroke-width="5"
  />

  <!-- calculator -->
  <g transform="translate(370 270) rotate(-9)">
    <rect
      width="80"
      height="110"
      rx="14"
      fill="#013269"
    />

    <rect
      x="10"
      y="10"
      width="60"
      height="20"
      rx="5"
      fill="#FFF8E9"
    />

    <g fill="#FFF8E9">
      <circle cx="20" cy="48" r="5.5"/>
      <circle cx="41" cy="48" r="5.5"/>
      <circle cx="63" cy="48" r="5.5"/>

      <circle cx="21" cy="71" r="5.5"/>
      <circle cx="42" cy="71" r="5.5"/>
      <circle cx="64" cy="71" r="5.5"/>

      <circle cx="22" cy="95" r="5.5"/>
      <circle cx="43" cy="95" r="5.5"/>
      <circle cx="65" cy="95" r="5.5"/>
    </g>
  </g>

  <!-- conversion arrows -->
 
</svg>