<svg
  width="700"
  height="500"
  viewBox="0 0 700 500"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- background buildings -->
  <g opacity="0.1">
    <rect opacity="0.5" x="60" y="170" width="75" height="180" rx="4" fill="#074a96"/>
    <rect opacity="0.8" x="140" y="120" width="100" height="230" rx="4" fill="#074a96"/>
    <rect x="250" y="150" width="85" height="200" rx="4" fill="#074a96"/>
    <rect x="340" y="100" width="115" height="250" rx="4" fill="#074a96"/>
    <rect opacity="0.8" x="460" y="140" width="90" height="210" rx="4" fill="#074a96"/>
    <rect opacity="0.5" x="555" y="180" width="70" height="170" rx="4" fill="#074a96"/>
  </g>

  <!-- windows -->
  <g fill="#002B5B">
    <rect x="80" y="195" width="12" height="15"/>
    <rect x="100" y="195" width="12" height="15"/>
    <rect x="80" y="220" width="12" height="15"/>
    <rect x="100" y="220" width="12" height="15"/>

    <rect x="165" y="150" width="14" height="16"/>
    <rect x="200" y="150" width="14" height="16"/>
    <rect x="165" y="185" width="14" height="16"/>
    <rect x="200" y="185" width="14" height="16"/>

    <rect x="370" y="130" width="14" height="16"/>
    <rect x="405" y="130" width="14" height="16"/>
    <rect x="370" y="165" width="14" height="16"/>
    <rect x="405" y="165" width="14" height="16"/>
  </g>

  <!-- ground -->
  <rect opacity="0.6" x="40" y="360" width="615" height="12" rx="6" fill="#073871"/>

  <!-- house -->
  <path
    d="M210 250L310 165L410 250V370H210V250Z"
    fill="#e3edf4"
  />

  <path
    d="M200 250L310 155L420 250"
    stroke="#002B5B"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- house side -->
  <path
    d="M310 165L420 250V370H310V165Z"
    fill="#002B5B"
  />

  <!-- door -->
  <rect
    x="275"
    y="285"
    width="55"
    height="85"
    rx="5"
    fill="#195faf"
  />

  <circle
    cx="317"
    cy="328"
    r="4"
    fill="#002B5B"
  />

  <!-- window -->
  <rect
    x="235"
    y="260"
    width="45"
    height="45"
    rx="4"
    fill="#C9E5F7"
    stroke="#002B5B"
    stroke-width="5"
  />

  <!-- calculator -->
  <g transform="translate(380 260) rotate(-7)">
    <rect
      width="105"
      height="130"
      rx="14"
      fill="#013269"
    />

    <rect
      x="16"
      y="18"
      width="73"
      height="28"
      rx="5"
      fill="#FFF8E9"
    />

    <g fill="#FFF8E9">
      <circle cx="28" cy="65" r="7"/>
      <circle cx="53" cy="65" r="7"/>
      <circle cx="78" cy="65" r="7"/>

      <circle cx="28" cy="88" r="7"/>
      <circle cx="53" cy="88" r="7"/>
      <circle cx="78" cy="88" r="7"/>

      <circle cx="28" cy="111" r="7"/>
      <circle cx="53" cy="111" r="7"/>
      <circle cx="78" cy="111" r="7"/>
    </g>
  </g>

  <!-- conversion arrows -->
  <path
    d="M540 410C590 440 610 375 605 340"
    stroke="#002B5B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <path
    d="M602 340L585 350"
    stroke="#002B5B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <path
    d="M175 390C125 380 105 350 110 315"
    stroke="#002B5B"
    stroke-width="8"
    stroke-linecap="round"
  />

  <path
    d="M110 315L127 325"
    stroke="#002B5B"
    stroke-width="8"
    stroke-linecap="round"
  />
</svg>